name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate branch name
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BRANCH_PATTERN='^(feature|bugfix|hotfix|release|chore|docs|refactor|test|ci)/[a-z0-9._-]+$'

          echo "Validating branch: ${BRANCH_NAME}"

          if [[ ! "${BRANCH_NAME}" =~ ${BRANCH_PATTERN} ]]; then
            echo "Invalid branch name: ${BRANCH_NAME}"
            echo "Expected pattern: ${BRANCH_PATTERN}"
            exit 1
          fi

      - name: Validate commit messages
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_PATTERN='^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\([a-z0-9._-]+\))?!?: .+'

          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1

          INVALID_COMMITS=0

          while IFS= read -r commit_subject; do
            if [[ ! "${commit_subject}" =~ ${COMMIT_PATTERN} ]]; then
              echo "Invalid commit message: ${commit_subject}"
              INVALID_COMMITS=1
            fi
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if [[ "${INVALID_COMMITS}" -ne 0 ]]; then
            echo "Commit messages must follow Conventional Commits."
            exit 1
          fi

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Build project
        run: ./mvnw -B -DskipTests package

      - name: Build Docker image
        shell: bash
        run: |
          IMAGE_NAME="practica-pr:${{ github.event.pull_request.number }}"
          docker build --file Dockerfile --tag "${IMAGE_NAME}" .

      - name: Show Docker image size
        shell: bash
        run: |
          IMAGE_NAME="practica-pr:${{ github.event.pull_request.number }}"
          IMAGE_SIZE_BYTES="$(docker image inspect "${IMAGE_NAME}" --format='{{.Size}}')"
          IMAGE_SIZE_MB="$(awk "BEGIN {printf \"%.2f\", ${IMAGE_SIZE_BYTES}/1024/1024}")"

          echo "Docker image size: ${IMAGE_SIZE_BYTES} bytes (${IMAGE_SIZE_MB} MB)"
